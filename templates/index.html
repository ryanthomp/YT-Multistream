<div class="container">
    <div class="text-center mt-5 card border-dark mb-3">
        <div class="card-header"><h4>Enter YouTube URLs</h4></div>
        <div class="card-body text-dark">
            <p class="card-text"></p>
        </div>
        <form action="/watch" method="POST">
            <div class="form-group row">
                <label for="URL1" class="col-sm-2 col-form-label">URL 1</label>
                <div class="col-sm-10">
                    <input name="URL1" type="text" class="form-control" id="URl1"
                           placeholder="Link 1">
                </div>
            </div>
            <div class="form-group row">
                <label for="URL2" class="col-sm-2 col-form-label">URL 2</label>
                <div class="col-sm-10">
                    <input name="URL2" type="text" class="form-control" id="URL2"
                           placeholder="Link 2">
                </div>
            </div>
            <div class="form-group row">
                <label for="URl3" class="col-sm-2 col-form-label">URL 3</label>
                <div class="col-sm-10">
                    <input name="URL3" type="text" class="form-control" id="URl3"
                           placeholder="Link 3">
                </div>
            </div>
            <div class="form-group row">
                <label for="URl4" class="col-sm-2 col-form-label">URL 4</label>
                <div class="col-sm-10">
                    <input name="URL4" type="text" class="form-control" id="URl4"
                           placeholder="Link 4">
                </div>
            </div>
              <button class="btn btn-primary" type="submit">Go</button>
